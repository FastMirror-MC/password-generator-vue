name: build and publish

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - uses: actions/setup-node@v1
        with:
          node-version: '18.x'
      - name: install pnpm 
        run: npm install -g pnpm
      - run: pnpm install
      - run: pnpm build

      # 新增：从 PROD 分支拉取 CNAME 并复制到 dist
      - name: Fetch CNAME from PROD
        run: |
          git fetch origin PROD
          git checkout origin/PROD -- CNAME 2>/dev/null || true
          if [ -f CNAME ]; then cp CNAME dist/; fi

      - name: Release to PROD Branch
        uses: casperdcl/push-dir@v1
        with:
          message: update PROD
          branch: PROD
          dir: dist
          history: false
          force: true
